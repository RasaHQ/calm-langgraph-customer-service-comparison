flows:
  search_hotel:
    description: search for hotels
    steps:
      - collect: trip_destination
        reset_after_flow_ends: false      
      - id: "verify_hotel_location_is_in_db"
        action: verify_hotel_location_is_in_db
        next:
          - if: not slots.is_hotel_location_in_db
            then: 
              - action: utter_hotel_location_not_in_db
                next: END
          - else: hotel_price_range
      - id: "hotel_price_range"
        collect: hotel_price_range
      - id: "hotel_start_date"
        collect: hotel_start_date
        # Keep dates after booking so a follow-up car flow can copy "same dates".
        # Do not null these at flow start — same-turn fills ("hotel for the same
        # dates") would be wiped by StartFlow before collect runs.
        reset_after_flow_ends: false
        description: >
          Hotel check-in date as an ISO datetime string. Only fill this slot when
          the current user message itself contains an explicit date or an explicit
          same-dates phrase ("same dates", "same dates as the car rental",
          "for the same dates", "those dates"). If the phrase refers to the car
          rental, copy the exact ISO value of slots.car_rental_start_date. Do not
          fill this slot just because slots.car_rental_start_date is already set
          from an earlier booking.
      - collect: hotel_end_date
        reset_after_flow_ends: false
        description: >
          Hotel check-out date as an ISO datetime string. Only fill this slot when
          the current user message itself contains an explicit date or an explicit
          same-dates phrase ("same dates", "same dates as the car rental",
          "for the same dates", "those dates"). If the phrase refers to the car
          rental, copy the exact ISO value of slots.car_rental_end_date. Do not
          fill this slot just because slots.car_rental_end_date is already set
          from an earlier booking.
        next:
          - if: not slots.hotel_start_date or not slots.hotel_end_date
            then: hotel_start_date
          - if: slots.hotel_start_date > slots.hotel_end_date
            then:
              - action: utter_invalid_date
              - set_slots:
                  - hotel_start_date: null
                  - hotel_end_date: null
                next: hotel_start_date
          - else: initiate_search
      - id: "initiate_search"
        action: search_hotels
      - collect: hotel_search_results_readable
      - collect: hotel_name
        description: >
          The hotel the user selected from hotel_search_results_readable.
          Always store the full "Name - PriceTier" string from that list when possible
          (e.g. "Hilton Basel - Luxury", "Marriott - Luxury", "Radisson - Basic").
          User may say a short name like "hilton" or "Marriott luxury" — map it to the
          matching list entry. If the option isn't listed, do not fill the slot.
      - collect: hotel_booking_confirmation
        ask_before_filling: true
        description: >
          Whether the user confirms booking this hotel. true for yes/confirm/book it;
          false for no/don't/not that/I don't want to book. A simple "no" to this
          confirmation question must SetSlot this to false — do not CancelFlow.
        next:
          - if: not slots.hotel_booking_confirmation
            then: 
              - action: utter_will_not_book_hotel
                next: END
          - else: 
            - action: utter_confirm_booked_hotel
              next: END
