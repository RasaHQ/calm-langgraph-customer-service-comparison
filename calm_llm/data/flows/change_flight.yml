flows:
  change_flight:
    description: change an existing booking to a new flight
    steps:
      - action: list_flight_bookings
        next:
          - if: "slots.unique_booking"
            then: "get_constraints"
          - else:
              - action: utter_unclear_which_flight
                next: END
      - id: "get_constraints"
        collect: flight_search_start_date
        description: >
          Concrete start date for flight search in ISO format (YYYY-MM-DD). If the
          user says "same week", "this week", "alternative ones for the same week",
          or similar, fill from the existing booking's departure date
          (slots.unique_booking.scheduled_departure date) and do not ask again.
      - collect: flight_search_end_date
        description: >
          Concrete end date for flight search in ISO format. If unset, "Any" is fine
          when the user only constrained the week of travel.
      - action: search_flights
      - action: utter_flight_search_results
      - collect: selected_flight_id
        description: >
          The selected flight_id number from the search results presented to the user
          (the number in parentheses). Results already exclude the current booking.
          If the user says "the next available option", "the first one", "that one",
          or similar, use the earliest chronologically listed result's id — never the
          flight they already hold.
      - action: new_flight_details
      - collect: flight_change_confirmation
        ask_before_filling: true
        description: >
          Whether the user confirms changing to the selected flight. true for
          yes/confirm/go ahead; false for no/don't. A simple "no" must SetSlot
          this to false — do not CancelFlow.
      - action: change_flight
        next:
          - if: "slots.change_flight_success"
            then:
              - action: utter_change_flight_successful
                next: END
          - else:
              - action: utter_change_flight_failed
                next: END
